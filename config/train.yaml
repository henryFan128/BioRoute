paths:
  data_dir: "data/split_random"
  model_save_path: "ckpt/random/ckpt.pt"

model_params:
  hidden_channels: 256
  out_channels: 128
  num_srr_layers: 2
  num_attention_heads: 4
  dropout: 0.2
  use_global_router: false
  mechanism_dropout: 0.1
  decoder_type: "bilinear"

training_params:
  lr: 3e-5
  weight_decay: 1e-4
  epochs: 1000
  warmup_epochs: 10
  eval_interval: 5
  log_interval: 1
  early_stopping_patience: 20
  grad_clip_norm: 0.5
  source_batch_size: 256
  train_neg_per_pos: 1
  online_negative_sampling: true
  use_contraindication_negatives: true
  negative_curriculum_epochs: 80
  negative_start_factor: 0.4
  hard_negative_ratio_start: 0.0
  min_learning_rate_ratio: 0.1
  monitor_gradients: false
  infonce_temperature: 0.1
  infonce_loss_mode: "per_positive"
  aux_bce_weight: 0
  aux_focal_enabled: false
  aux_focal_alpha: 0.25
  aux_focal_gamma: 1
  aux_focal_weight: 0.5
  edge_dropout_p: 0.1
  primary_metric: "aupr"
  ranking_group_axis: "src"
  gpu_id: 0
  distributed: false
  seed: 42
